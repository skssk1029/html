<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Life - 당신의 일상을 관리해보세요</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:ital,wght@0,700;0,900;1,800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Agbalumo&display=swap"
      rel="stylesheet"
    />
    <style>
      .mobile-section {
        position: relative;
        min-height: 760px;
        overflow: hidden;
        padding-bottom: 0;
      }

      .mobile-content {
        position: relative;
        min-height: 560px;
      }

      .app-icon-box {
        text-align: center;
        margin-top: 70px;
      }

      .app-icon-box img {
        width: 170px;
        display: block;
        margin: 0 auto 16px;
      }

      .app-icon-box p {
        font-size: 24px;
        font-weight: 520;
        color: #555;
      }

      .mobile-character {
        position: absolute;
        right: -80px;
        bottom: -0px;
        width: 430px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --green: #09f490;
        --green-dark: #1db860;
        --green-light: #d4f5e2;
        --green-pale: #edfaf3;
        --green-mid: #a8eaca;
        --white: #ffffff;
        --text: #004b2b;
        --text-sub: #555;
        --radius: 18px;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Noto Sans KR", sans-serif;
        color: var(--text);
        background: var(--white);
        overflow-x: hidden;
      }

      nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--white);
        display: flex;
        align-items: center;
        padding: 0 60px;
        height: 84px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
      }

      .nav-logo {
        font-family: "Agbalumo", cursive;
        font-size: 36px;
        color: var(--green-dark);
        margin-right: 64px;
        letter-spacing: 0px;
      }

      .agbalumo {
        font-family: "Agbalumo", cursive;
        font-weight: normal;
        font-size: 1.3em;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        text-decoration: none;
        font-size: 20px;
        font-weight: 500;
        color: var(--text);
        transition: color 0.2s;
      }

      .nav-links a:hover {
        color: var(--green-dark);
      }

      .hero {
        background: var(--green);
        border-radius: 0 0 40px 40px;

        display: flex;
        align-items: center;

        justify-content: flex-start;

        padding: 100px 80px;
        position: relative;
        overflow: hidden;
      }
      .hero-image {
        position: absolute;
        right: 0;
        bottom: 0;
        top: 0;

        display: flex;
        align-items: flex-end;
      }

      .hero-image img {
        height: 100%;
        width: auto;
        display: block;
      }

      .hero-text {
        max-width: 760px;
        position: relative;
        z-index: 5;
        margin-left: 0;
      }

      .hero-text h1 {
        font-size: 42px;
        font-weight: 600;
        line-height: 1.2;
        color: #004b2b;
        margin-bottom: 40px;
      }

      .hero-text h1 em {
        font-family: "Nunito", sans-serif;
        font-style: italic;
        display: block;
        font-size: 52px;
      }

      .hero-text p {
        font-size: 20px;
        font-weight: 520;
        color: #004b2b;
        margin-bottom: 5px;
        line-height: 1.6;
      }

      .btn {
        display: inline-block;
        background: var(--white);
        color: var(--green-dark);
        font-size: 16px;
        font-weight: 700;
        padding: 12px 28px;
        border-radius: 50px;
        text-decoration: none;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
      }

      .hero::before {
        content: "";
        position: absolute;

        width: 1100px;
        height: 1100px;

        left: -400px;
        top: -200px;

        border-radius: 50%;
        background: #dbf4de;
        z-index: 1;
      }

      section {
        padding: 80px 60px;
      }

      .section-title {
        text-align: center;
        font-family: "Agbalumo", cursive;
        font-style: normal;
        font-size: 40px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 36px;
      }
      .section-title .agbalumo {
        font-size: 1em;
        font-style: normal;
      }

      .section-sub {
        text-align: center;
        font-size: 20px;
        font-weight: 480;
        color: #004b2b;
        line-height: 1.7;
        margin-bottom: 48px;
      }

      footer {
        background: var(--green);
        padding: 28px 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        color: var(--text-sub);
        border-top: 1px solid var(--green-light);
      }

      footer .foot-logo {
        font-family: "Agbalumo", cursive;
        font-weight: 500;
        font-size: 17px;
        color: #004b2b;
      }

      footer .foot-links {
        display: flex;
        font-weight: 500;
        gap: 20px;
      }

      footer .foot-links a {
        color: var(--text-sub);
        text-decoration: none;
      }

      footer .foot-links a:hover {
        color: var(--green-light);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-up {
        animation: fadeUp 0.6s ease both;
      }

      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 0.55s ease,
          transform 0.55s ease;
      }

      .reveal.visible {
        opacity: 1;
        transform: none;
      }
    </style>
  </head>

  <body>
    <nav>
      <span class="nav-logo">All Life</span>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="service.html">Service</a>
        <a href="mobile.html">Mobile</a>
      </div>
    </nav>

    <header class="hero">
      <div class="small-dot"></div>
      <div class="hero-text fade-up">
        <h1>
          모바일에서<br />
          <span class="agbalumo">All Life</span> 를 만나보세요!
        </h1>

        <p>당신에게 가장 필요한 순간에 가장 적합한 서비스를 제공합니다.</p>
      </div>

      <div class="hero-image">
        <img src="snap/m1.png" alt="모바일" />
      </div>
    </header>

    <section class="mobile-section">
      <p class="section-title reveal">
        <span class="agbalumo">Mobile</span>
      </p>

      <p class="section-sub reveal">
        모바일 앱을 다운받아 지금 바로 당신의 일상을 관리하세요!
      </p>

      <div class="mobile-content reveal">
        <div class="app-icon-box">
          <img src="snap/m2.png" alt="All Life 앱 아이콘" />
          <p>All Life</p>
        </div>

        <img class="mobile-character" src="snap/m3.png" alt="모바일 캐릭터" />
      </div>
    </section>
    <footer>
      <span class="foot-logo">All Life</span>
      <div class="foot-links">
        <a href="#">About</a>
        <a href="#">Tip</a>
      </div>
      <span>© All Life</span>
    </footer>

    <script>
      const reveals = document.querySelectorAll(".reveal");

      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("visible");
              io.unobserve(e.target);
            }
          });
        },
        { threshold: 0.12 },
      );

      reveals.forEach((el) => io.observe(el));
    </script>
  </body>
</html>
