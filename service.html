<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>All Life - Service</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Agbalumo&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Noto Sans KR", sans-serif;
        color: #004b2b;
        background: #fff;
      }

      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }

      .reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }

      nav {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        height: 84px;
        padding: 0 60px;
        background: #fff;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
      }

      .nav-logo {
        margin-right: 64px;
        font-family: "Agbalumo", cursive;
        font-size: 36px;
        color: #1db860;
      }

      .nav-links {
        display: flex;
        gap: 32px;
      }

      .nav-links a {
        color: #004b2b;
        font-size: 20px;
        font-weight: 500;
        text-decoration: none;
        transition: color 0.2s;
      }

      .nav-links a:hover {
        color: #1db860;
      }

      .page-title {
        padding: 90px 0 40px;
        text-align: center;
      }

      .page-title h1 {
        margin-bottom: 45px;
        font-family: "Agbalumo", cursive;
        font-size: 42px;
        font-weight: 500;
      }

      .page-title p {
        font-size: 20px;
        font-weight: 500;
      }

      .page-title span {
        font-family: "Agbalumo", cursive;
        font-size: 22px;
        font-weight: 500;
      }

      .service-wrap {
        width: 86%;
        margin: 0 auto 80px;
      }

      .service-card {
        margin-bottom: 60px;
        padding: 50px 60px;
        background: #f3f7f4;
        border-radius: 22px;
        text-align: center;
        scroll-margin-top: 220px;
      }

      .service-card h2 {
        margin-bottom: 22px;
        font-size: 26px;
        font-weight: 550;
      }

      .service-card img {
        display: block;
        width: 70%;
        max-width: 720px;
        margin: 30px auto 0;
      }

      .service-btn {
        display: inline-block;
        padding: 10px 24px;
        color: #004b2b;
        background: #09f490;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 510;
        text-decoration: none;
        transition: all 0.25s ease;
      }

      .service-btn:hover {
        color: #004b2b;
        background: #09f490;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        transform: translateY(-3px);
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 60px;
        color: #555;
        background: #09f490;
        border-top: 1px solid #d4f5e2;
        font-size: 13px;
      }

      footer .foot-logo {
        color: #004b2b;
        font-family: "Agbalumo", cursive;
        font-size: 17px;
        font-weight: 500;
      }

      footer .foot-links {
        display: flex;
        gap: 20px;
        font-weight: 500;
      }

      footer .foot-links a {
        color: #555;
        text-decoration: none;
      }

      footer .foot-links a:hover {
        color: #d4f5e2;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.3s ease,
          visibility 0.3s ease;
      }

      .modal.active {
        opacity: 1;
        visibility: visible;
      }

      .modal-box {
        position: relative;
        width: 700px;
        max-width: 90%;
        max-height: 80vh;
        padding: 40px;
        overflow-y: auto;
        background: #dff5e3;
        border-radius: 30px;
        opacity: 0;
        transform: translateY(80px);
        transition:
          transform 0.35s ease,
          opacity 0.35s ease;
      }

      .modal.active .modal-box {
        opacity: 1;
        transform: translateY(0);
      }

      .modal-box h2 {
        padding-right: 40px;
        margin-bottom: 30px;
        font-size: 25px;
        line-height: 1.4;
      }

      .close {
        position: absolute;
        top: 8px;
        right: 20px;
        font-size: 35px;
        cursor: pointer;
      }

      #modal-text {
        color: #004b2b;
        font-size: 15px;
        line-height: 1.8;
        word-break: keep-all;
      }

      .agreement-name {
        margin-bottom: 32px;
        font-size: 19px;
        font-weight: 700;
      }

      .agreement-section {
        margin-bottom: 34px;
      }

      .agreement-section:last-child {
        margin-bottom: 0;
      }

      .agreement-section h3 {
        margin-bottom: 12px;
        font-size: 17px;
        font-weight: 700;
      }

      .agreement-section p {
        margin-bottom: 14px;
      }

      .agreement-section p:last-child {
        margin-bottom: 0;
      }

      .agreement-item {
        margin: 17px 0;
        padding: 12px 0 12px 15px;
        border-left: 3px solid #09f490;
      }

      .agreement-item strong {
        display: block;
        margin-bottom: 5px;
      }

      .agreement-list {
        margin: 12px 0 18px 22px;
        padding-left: 5px;
      }

      .agreement-list li {
        margin-bottom: 8px;
        padding-left: 3px;
      }

      .agreement-list li:last-child {
        margin-bottom: 0;
      }

      /* 드래그하면 나타나는 위치 약관 문구 */
      .hidden-drag {
        color: transparent;
        user-select: text;
      }

      .hidden-drag::selection {
        color: #004b2b;
        background: #09f490;
      }

      /* 작고 흐리게 표시되는 음성 약관 문구 */
      .hidden-small-text {
        margin-top: 22px;
        color: rgba(0, 75, 43, 0.03);
        font-size: 11px;
        line-height: 1.25;
        letter-spacing: -0.3px;
        user-select: text;
        transition: color 0.25s ease;
      }

      .hidden-small-text:hover {
        color: rgba(0, 75, 43, 0.28);
      }

      .hidden-small-text::selection {
        color: #004b2b;
        background: #09f490;
      }

      /* 마우스를 올렸을 때 문장이 변경되는 스타일 약관 문구 */
      .hover-change {
        position: relative;
        min-height: 78px;
        padding: 12px 15px;
        overflow: hidden;
        border-radius: 10px;
        cursor: default;
        transition: background 0.25s ease;
      }

      .hover-change:hover {
        color: #004b2b;
        background: #09f490;
      }

      .hover-change .default-text,
      .hover-change .hover-text {
        display: block;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
      }

      .hover-change .default-text {
        opacity: 1;
        transform: translateY(0);
      }

      .hover-change .hover-text {
        position: absolute;
        top: 12px;
        right: 15px;
        left: 15px;
        opacity: 0;
        transform: translateY(8px);
      }

      .hover-change:hover .default-text {
        opacity: 0;
        transform: translateY(-8px);
      }

      .hover-change:hover .hover-text {
        opacity: 1;
        transform: translateY(0);
      }

      /* 통화 약관 스크롤 끝에서 나타나는 영역 */
      .scroll-reveal-box {
        min-height: 92px;
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid rgba(0, 75, 43, 0.12);
      }

      .scroll-loading,
      .scroll-hidden-message {
        display: none;
      }

      .scroll-reveal-box.loading .scroll-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 18px 0;
        color: rgba(0, 75, 43, 0.55);
        font-size: 12px;
      }

      .loading-spinner {
        width: 17px;
        height: 17px;
        border: 2px solid rgba(0, 75, 43, 0.15);
        border-top-color: #09f490;
        border-radius: 50%;
        animation: loading-spin 0.7s linear infinite;
      }

      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .scroll-reveal-box.loaded .scroll-hidden-message {
        display: block;
        padding: 12px 14px;
        color: #004b2b;
        background: #09f490;
        border-radius: 9px;
        font-size: 15px;
        line-height: 1.7;
        animation: scroll-message-show 0.45s ease both;
      }

      @keyframes scroll-message-show {
        from {
          opacity: 0;
          transform: translateY(12px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        nav {
          height: 72px;
          padding: 0 24px;
        }

        .nav-logo {
          margin-right: 30px;
          font-size: 29px;
        }

        .nav-links {
          gap: 16px;
        }

        .nav-links a {
          font-size: 15px;
        }

        .page-title {
          padding: 65px 20px 35px;
        }

        .page-title h1 {
          margin-bottom: 25px;
          font-size: 36px;
        }

        .page-title p {
          font-size: 16px;
        }

        .service-wrap {
          width: 92%;
        }

        .service-card {
          padding: 35px 20px;
        }

        .service-card h2 {
          font-size: 21px;
        }

        .service-card img {
          width: 95%;
        }

        .modal-box {
          padding: 35px 25px;
        }

        .modal-box h2 {
          font-size: 21px;
        }

        .hover-change {
          min-height: 105px;
        }

        footer {
          padding: 24px;
        }
      }
    </style>
  </head>

  <body>
    <nav>
      <div class="nav-logo">All Life</div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="service.html">Service</a>
        <a href="mobile.html">Mobile</a>
      </div>
    </nav>

    <section class="page-title reveal">
      <h1>Service</h1>

      <p>
        이곳에서
        <span>All Life</span>가 제공하는 서비스를 확인해보세요!
      </p>
    </section>

    <section class="service-wrap">
      <div class="service-card reveal" id="location">
        <h2>실시간 위치 기반 서비스</h2>
        <a href="#" class="service-btn" data-type="location">이용약관 보기</a>
        <img src="snap/q1.png" alt="실시간 위치 기반 서비스" />
      </div>

      <div class="service-card reveal" id="style">
        <h2>카메라 &amp; 이미지 기반 스타일 관리</h2>
        <a href="#" class="service-btn" data-type="style">이용약관 보기</a>
        <img src="snap/q2.png" alt="스타일 관리" />
      </div>

      <div class="service-card reveal" id="voice">
        <h2>음성 데이터 기반 맞춤 광고</h2>
        <a href="#" class="service-btn" data-type="voice">이용약관 보기</a>
        <img src="snap/q3.png" alt="음성 데이터 서비스" />
      </div>

      <div class="service-card reveal" id="call">
        <h2>스팸 차단, 통화 요약 정리 서비스</h2>
        <a href="#" class="service-btn" data-type="call">이용약관 보기</a>
        <img src="snap/q4.png" alt="통화 요약 서비스" />
      </div>
    </section>

    <footer>
      <span class="foot-logo">All Life</span>

      <div class="foot-links">
        <a href="#">About</a>
        <a href="#">Tip</a>
      </div>

      <span>© All Life</span>
    </footer>

    <div id="modal" class="modal">
      <div class="modal-box">
        <span class="close">&times;</span>
        <h2 id="modal-title">이용약관</h2>
        <div id="modal-text"></div>
      </div>
    </div>

        </section>

        <section class="agreement-section">
          <h3>제4조 (서비스 이용요금)</h3>

      const reveals = document.querySelectorAll(".reveal");

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
            }
          });
        },
        {
          threshold: 0.15,
        },
      );

      reveals.forEach((element) => {
        observer.observe(element);
      });

      let callWheelHandler = null;

      function clearCallScrollReveal() {
        if (callScrollHandler) {
          modalBox.removeEventListener("scroll", callScrollHandler);
          callScrollHandler = null;
        }

        if (callWheelHandler) {
          modalBox.removeEventListener("wheel", callWheelHandler);
          callWheelHandler = null;
        }

        if (callRevealTimer) {
          clearTimeout(callRevealTimer);
          callRevealTimer = null;
        }
      }

      function setupCallScrollReveal() {
        clearCallScrollReveal();

        const revealBox = document.getElementById("call-scroll-reveal");

        if (!revealBox) {
          return;
        }

        let loadingStarted = false;
        let bottomScrollCount = 0;
        let lastBottomWheelTime = 0;

        /*
          맨 아래까지 도달한 뒤에도 아래 방향으로
          8번 더 스크롤해야 로딩이 시작됩니다.
        */
        const requiredBottomScrollCount = 2;

        /*
          트랙패드나 마우스 휠의 연속 이벤트가
          한 번에 여러 번 계산되지 않도록 제한합니다.
        */
        const wheelCountInterval = 180;

        callScrollHandler = function () {
          const distanceFromBottom =
            modalBox.scrollHeight - modalBox.scrollTop - modalBox.clientHeight;

          /*
            사용자가 맨 아래에서 다시 위로 올라가면
            추가 스크롤 횟수를 초기화합니다.
          */
          if (distanceFromBottom > 20) {
            bottomScrollCount = 0;
            lastBottomWheelTime = 0;
          }
        };

        callWheelHandler = function (event) {
          if (loadingStarted) {
            return;
          }

          const distanceFromBottom =
            modalBox.scrollHeight - modalBox.scrollTop - modalBox.clientHeight;

          const isAtBottom = distanceFromBottom <= 3;
          const isScrollingDown = event.deltaY > 0;

          if (!isAtBottom || !isScrollingDown) {
            return;
          }

          const currentTime = Date.now();

          /*
            마지막으로 인정된 스크롤 이후 180ms 이상
            지나야 새로운 스크롤 1회로 계산합니다.
          */
          if (currentTime - lastBottomWheelTime < wheelCountInterval) {
            return;
          }

          lastBottomWheelTime = currentTime;
          bottomScrollCount += 1;

          if (bottomScrollCount < requiredBottomScrollCount) {
            return;
          }

          loadingStarted = true;

          revealBox.classList.add("loading");

          callRevealTimer = setTimeout(() => {
            revealBox.classList.remove("loading");
            revealBox.classList.add("loaded");

            requestAnimationFrame(() => {
              modalBox.scrollTo({
                top: modalBox.scrollHeight,
                behavior: "smooth",
              });
            });

            callRevealTimer = null;
          }, 1200);

          modalBox.removeEventListener("scroll", callScrollHandler);
          modalBox.removeEventListener("wheel", callWheelHandler);

          callScrollHandler = null;
          callWheelHandler = null;
        };

        modalBox.addEventListener("scroll", callScrollHandler);
        modalBox.addEventListener("wheel", callWheelHandler);
      }

      document.querySelectorAll(".service-btn").forEach((button) => {
        button.addEventListener("click", function (event) {
          event.preventDefault();

          const type = this.dataset.type;
          const agreement = agreements[type];

          if (!agreement) {
            return;
          }

          clearCallScrollReveal();

          modalTitle.textContent = agreement.title;
          modalText.innerHTML = agreement.text;

          modal.classList.add("active");
          document.body.style.overflow = "hidden";

          modalBox.scrollTop = 0;

          if (type === "call") {
            setupCallScrollReveal();
          }
        });
      });

      function closeModal() {
        clearCallScrollReveal();

        modal.classList.remove("active");
        document.body.style.overflow = "";
        modalBox.scrollTop = 0;
      }

      document.querySelector(".close").addEventListener("click", closeModal);

      modal.addEventListener("click", function (event) {
        if (event.target === modal) {
          closeModal();
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && modal.classList.contains("active")) {
          closeModal();
        }
      });
    </script>
